# Doc Assistant — Complete Production Docker Compose Orchestration
version: "3.9"

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: doc-assistant-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      - HOST=0.0.0.0
      - PORT=8000
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - DATA_DIR=/app/data
    depends_on:
      - qdrant
    volumes:
      - ./data:/app/data
      - cache_data:/app/.cache
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/chat').close()\" || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - doc_network

  qdrant:
    image: qdrant/qdrant:latest
    container_name: doc-assistant-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    environment:
      - QDRANT__SERVICE__HTTP_PORT=6333
      - QDRANT__SERVICE__GRPC_PORT=6334
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped
    networks:
      - doc_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: doc-assistant-frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://api:8000
    depends_on:
      - api
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:5173 || wget --no-verbose --tries=1 --spider http://127.0.0.1:80 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped
    networks:
      - doc_network

volumes:
  qdrant_data:
    driver: local
  cache_data:
    driver: local

networks:
  doc_network:
    driver: bridge
