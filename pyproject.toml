[tool.poetry]
name = "doc-assistant"
version = "0.1.0"
description = "Corporate Document Assistant — Hybrid RAG platform with citation-grounded generation"
authors = ["Michael <michael@example.com>"]
readme = "README.md"
packages = [{include = "api", from = "src"}, {include = "retrieval", from = "src"}, {include = "generation", from = "src"}, {include = "ingestion", from = "src"}, {include = "clients", from = "src"}, {include = "models", from = "src"}, {include = "core", from = "src"}, {include = "cache", from = "src"}]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.110.0"
uvicorn = {extras = ["standard"], version = "^0.28.0"}
pydantic = "^2.6.4"
pydantic-settings = "^2.2.1"
openai = "^1.14.0"
httpx = "^0.28.0"
structlog = "^24.1.0"
python-dotenv = "^1.0.1"
tenacity = "^8.2.3"
tiktoken = "^0.6.0"
qdrant-client = "^1.8.0"
rank-bm25 = "^0.2.2"
flashrank = "^0.2.0"
pymupdf = "^1.28.2"
pdfplumber = "^0.11.10"

[tool.poetry.group.dev.dependencies]
pytest = "^8.1.1"
pytest-cov = "^4.1.0"
pytest-asyncio = "^0.23.5"
ruff = "^0.3.3"
mypy = "^1.9.0"
pre-commit = "^3.6.2"
detect-secrets = "^1.4.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501", "UP017"]

[tool.ruff.lint.isort]
known-first-party = ["api", "retrieval", "generation", "ingestion", "clients", "models", "core", "cache"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
explicit_package_bases = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unused_configs = true
disallow_untyped_decorators = false
ignore_missing_imports = true
exclude = [
    '^frontend/',
    '^tests/fixtures/',
    '^data/',
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
addopts = "--cov=src --cov-report=term-missing --cov-report=xml"

[tool.coverage.run]
source = ["src"]

[tool.coverage.report]
show_missing = true
fail_under = 80
