# Ruff linting & formatting config
line-length = 88
target-version = "py311"

[lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "RUF", # Ruff-specific rules
]
ignore = [
    "E501", # Line length handled by formatter
    "UP017",
]

[lint.isort]
known-first-party = ["api", "retrieval", "generation", "ingestion", "clients", "models", "core", "cache"]

[format]
quote-style = "double"
indent-style = "space"
